<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Letter</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3e9d8;--gold:#e8b86a;--night:#05070d;--blue:#0c1424;--dawn:#f6a96b;box-sizing:border-box}
*{box-sizing:inherit;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--night);transition:background 2s}
.sc{position:absolute;inset:0;opacity:0;transition:opacity 1.8s;pointer-events:none;display:flex;align-items:center;justify-content:center}
.sc.on{opacity:1;pointer-events:auto}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;z-index:20}
#fx{position:absolute;inset:0;pointer-events:none;z-index:19}
#vig{position:absolute;inset:0;pointer-events:none;z-index:18;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65))}
#txt{position:absolute;left:0;right:0;bottom:calc(11% + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(22px,5.4vw,40px);font-weight:300;font-style:italic;letter-spacing:.02em;line-height:1.35;padding:0 8%;z-index:25;opacity:0;transition:opacity 1.4s;text-shadow:0 2px 18px #000;pointer-events:none}
#txt.mid{bottom:auto;top:50%;transform:translateY(-50%)}
#txt.show{opacity:1}
#txt.hand{font-family:'Caveat',cursive;font-style:normal;font-size:clamp(26px,6.5vw,46px);color:#f6e7c8}
.btn{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(243,233,216,.4);color:var(--ink);padding:10px 26px;border-radius:30px;font:italic 300 19px 'Cormorant Garamond',serif;letter-spacing:.06em;cursor:pointer;opacity:0;transition:opacity 1.2s;pointer-events:none}
.btn.show{opacity:.9;pointer-events:auto}
#mus{position:fixed;z-index:40;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(0,0,0,.35);border:1px solid rgba(243,233,216,.25);color:var(--ink);border-radius:20px;padding:6px 14px;font:300 15px 'Cormorant Garamond',serif;cursor:pointer;display:none}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s}
.photo.on{opacity:1;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.warm{filter:sepia(.35) saturate(.9) contrast(1.05) brightness(.92)}
/* start */
#start{z-index:50;background:#000;flex-direction:column;gap:26px;text-align:center;cursor:pointer}
#start p{font-size:20px;font-style:italic;opacity:.7;animation:br 3s infinite}
@keyframes br{50%{opacity:.25}}
/* envelope */
#env{position:relative;width:min(78vw,380px);height:min(52vw,250px);background:#d9c7a3;box-shadow:0 30px 80px #000;border-radius:3px;transition:transform 2s,opacity 2s}
#env:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#c9b48a,#e6d6b3);border-radius:3px}
#flap{position:absolute;left:0;right:0;top:0;height:60%;background:#cdb88e;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.6s;z-index:3}
#env.open #flap{transform:rotateX(180deg);z-index:0}
#seal{position:absolute;left:50%;top:52%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(#b3322e,#7a1a1a);z-index:4;transition:opacity .8s}
#env.open #seal{opacity:0}
#paper{position:absolute;left:7%;right:7%;top:8%;bottom:6%;background:#f5ecd6;z-index:1;transition:transform 2s 1s;padding:14px;font-family:'Caveat',cursive;font-size:clamp(15px,3.6vw,20px);color:#4a3a28;text-align:center;display:flex;align-items:center;justify-content:center}
#env.open #paper{transform:translateY(-62%)}
/* scratch */
#scr{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:5;cursor:crosshair;transition:opacity 2.5s}
#spark span{position:absolute;color:#ffe3a3;animation:tw 2.6s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.9;transform:scale(1)}}
/* room scenes */
.svgfull{position:absolute;inset:0;width:100%;height:100%}
.bk{position:absolute;border-radius:50%;filter:blur(14px);opacity:.7;animation:bk 6s ease-in-out infinite alternate}
@keyframes bk{to{opacity:.3;transform:scale(1.2)}}
.flame{transform-origin:50% 100%;animation:fl .18s infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.88,1.1) rotate(2deg)}}
#candleWrap{transition:transform 6s ease-in-out;transform-origin:50% 62%}
/* phone */
#phone{width:min(70vw,300px);height:min(120vw,520px);max-height:78vh;border-radius:34px;background:#0b0e14;border:2px solid #2a3140;box-shadow:0 0 90px rgba(120,160,255,.15);padding:26px 18px;position:relative;font-family:system-ui,sans-serif}
#bub{background:#1d6ef2;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 14px;font-size:15px;line-height:1.4;margin-top:40px;min-height:90px;white-space:pre-line}
#sendb{position:absolute;right:20px;bottom:90px;width:44px;height:44px;border-radius:50%;background:#1d6ef2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
#finger{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.55);left:30%;bottom:25%;opacity:0;transition:all 2.2s ease-in-out;z-index:2}
/* letter */
#ltr{position:absolute;inset:0;overflow-y:auto;padding:12vh 9% 14vh;text-align:center;font-family:'Caveat',cursive;font-size:clamp(24px,5.6vw,36px);line-height:1.5;color:#f4e6c6;z-index:3}
#ltr p{margin-bottom:.9em;opacity:0;transition:opacity 2.4s}
#ltr p.s{opacity:1}
#sun{position:absolute;left:50%;bottom:30%;width:46vmin;height:46vmin;margin-left:-23vmin;border-radius:50%;background:radial-gradient(circle,#fff4d0 0,#ffc880 35%,rgba(255,150,80,.0) 70%);transition:transform 14s ease-out,bottom 14s ease-out}
#walker{position:absolute;bottom:17%;left:12%;transition:left 20s linear,opacity 3s}
.fig{transition:left 28s linear,opacity 4s}
.rp #replay{display:block}
</style></head><body>
<div id="stage">
<button id="mus">♪ Music on</button>

<div class="sc on" id="start"><div style="font-size:15px;opacity:.5;letter-spacing:.2em">BEST WITH HEADPHONES</div><p>Tap to begin</p></div>

<div class="sc" id="s0"><div id="env"><div id="paper">To someone who will always be a beautiful chapter of my life…</div><div id="flap"></div><div id="seal"></div></div></div>

<div id="txt"></div>

<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),txt=$('txt'),go=$('go');
/* ---------- audio ---------- */
let AC,master,musicOn=true,mood='off',bar=0,rainG,tmr;
const CH={dark:[[110,220,261.6,329.6],[87.3,174.6,220,261.6],[130.8,261.6,329.6,392],[98,196,246.9,293.7]],
warm:[[110,220,261.6,329.6,440],[87.3,174.6,220,261.6,349.2],[130.8,261.6,329.6,392,523.3],[98,196,246.9,293.7,392]],
hope:[[130.8,261.6,329.6,392,523.3],[87.3,174.6,261.6,349.2,440],[98,196,293.7,392,493.9],[110,220,261.6,329.6,440]]};
function audioInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
 const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;window.NB=b;
 const n=AC.createBufferSource();n.buffer=b;n.loop=true;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800;rainG=AC.createGain();rainG.gain.value=0;n.connect(f).connect(rainG).connect(master);n.start();
 tmr=setInterval(tick,2600)}
function note(fr,dt,dur,v,type){if(!AC)return;const t=AC.currentTime+dt,o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.1)}
function pad(fr,dt,dur,v){const t=AC.currentTime+dt,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=fr;f.type='lowpass';f.frequency.value=700;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.1)}
function tick(){if(!AC||mood==='off'||!musicOn||mood==='end')return;const c=CH[mood][bar++%4],sparse=mood==='dark',hopeful=mood==='hope';
 note(c[0],0,3,.16);const arp=sparse?[1,3,2]:[1,2,3,4,3,2,4].slice(0,hopeful?6:4);arp.forEach((k,i)=>{const fr=c[Math.min(k,c.length-1)]*(hopeful?2:1);note(fr,.3+i*(hopeful?.38:.55),2.2,.1+(i%2)*.02)});
 if(mood!=='dark'||bar%2){pad(c[1],0,3.4,.025);pad(c[2]*1.002,0,3.4,.02)}}
function setMood(m){mood=m;if(rainG)rainG.gain.linearRampToValueAtTime(m==='rain'?.1:0,AC.currentTime+2);if(m==='rain')mood='dark'; if(m==='rain')rainG.gain.linearRampToValueAtTime(.09,AC.currentTime+2)}
function burst(dur,fq,vol,type,sweep){if(!AC||!musicOn)return;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=fq;if(sweep)f.frequency.linearRampToValueAtTime(sweep,AC.currentTime+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);s.connect(f).connect(g).connect(master);s.start();s.stop(AC.currentTime+dur)}
const SFX={paper:()=>burst(1.4,2500,.25),scratch:()=>burst(.12,3500,.1),shutter:()=>{burst(.05,5000,.3,'highpass');setTimeout(()=>burst(.07,3000,.25,'highpass'),90)},wind:()=>burst(3,500,.12,'bandpass',900),light:()=>{burst(.25,6000,.25,'highpass');setTimeout(()=>note(900,0,.3,.03,'sine'),200)},whoosh:()=>burst(1.6,300,.2,'bandpass',2200),type:()=>burst(.03,4000,.08,'highpass'),ding:()=>{note(1318,0,.5,.08,'sine');note(1760,.14,.7,.08,'sine')},last:()=>{note(261.6,0,6,.22);note(523.3,0,6,.1,'sine')}};
$('mus').onclick=()=>{musicOn=!musicOn;master.gain.value=musicOn?.8:0;$('mus').textContent=musicOn?'♪ Music on':'♪ Music off'};
/* ---------- helpers ---------- */
const show=id=>{document.querySelectorAll('.sc').forEach(s=>{if(s.id!==id&&s.id!=='end')s.classList.remove('on')});$(id).classList.add('on')};
async function say(t,hold,o){o=o||{};txt.className=(o.mid?'mid ':'')+(o.hand?'hand':'');txt.innerHTML=t;await sleep(60);txt.classList.add('show');await sleep(1400+(hold||2600));txt.classList.remove('show');await sleep(1300)}
async function lines(a,h,o){for(const t of a)await say(t,h,o)}
function tap(label){return new Promise(r=>{go.textContent=label||'continue';go.classList.add('show');go.onclick=()=>{go.classList.remove('show');go.onclick=null;r()}})}
/* grain + dust */
const gc=$('grain'),gx=gc.getContext('2d'),fx=$('fx'),fc=fx.getContext('2d');let W,H,dust=[],dustOn=true;
function rs(){W=fx.width=gc.width=innerWidth;H=fx.height=gc.height=innerHeight;gc.width=W/3;gc.height=H/3}rs();addEventListener('resize',rs);
for(let i=0;i<45;i++)dust.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.00025+.00008,a:Math.random()*.5+.2});
(function loop(){const im=gx.createImageData(gc.width,gc.height),d=im.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gx.putImageData(im,0,0);
 fc.clearRect(0,0,W,H);if(dustOn){fc.fillStyle='#ffe2ad';dust.forEach(p=>{p.y-=p.v*16;p.x+=Math.sin(p.y*9)*.0004;if(p.y<0){p.y=1;p.x=Math.random()}fc.globalAlpha=p.a*.6;fc.beginPath();fc.arc(p.x*W,p.y*H,p.r,0,7);fc.fill()})}setTimeout(()=>requestAnimationFrame(loop),60)})();
/* ---------- film ---------- */
async function film(){
 audioInit();if(AC.state==='suspended')AC.resume();$('mus').style.display='block';
 $('start').classList.remove('on');dustOn=false;
 // OPENING
 setMood('dark');await sleep(2500);
 await say('Some stories don’t get the ending we imagined…',2200);await say('But that doesn’t make them meaningless.',2200);
 show('s0');await sleep(2200);await say('To someone who will always be a beautiful chapter of my life…',2400,{mid:0});
 await say('Happy Birthday.',1800);SFX.paper();$('env').classList.add('open');await sleep(3200);
 await tap('continue');
 // SCENE 1 scratch
 txt.className='';dustOn=true;show('s1');$('stage').style.background='#0a0705';setMood('warm');
 await scratch();
 // SCENE 2 memories
 show('s2');const cap=[['Some moments stay.',0],['Some smiles are never forgotten.',1],['Some people become memories...',2],['...but never become strangers to the heart.',3]];
 for(const [t,i] of cap){document.querySelectorAll('#s2 .photo').forEach(p=>p.classList.remove('on'));SFX.shutter();$('m'+i).classList.add('on');await say(t,4600,{hand:1})}
 document.querySelectorAll('#s2 .photo').forEach(p=>p.classList.remove('on'));await sleep(1500);
 // SCENE 3 boy
 dustOn=false;setMood('rain');show('s3');await sleep(3500);SFX.wind();
 await say('He moved on with life...',2400);await say('But some memories never really leave.',2600);await say('Especially hers.',2800);
 // SCENE 4 cake
 setMood('dark');show('s4');$('boyC').style.opacity=1;await sleep(3000);
 await say('Some birthdays are celebrated together.',2400);await say('Some are celebrated from a distance.',2600);
 await tap('light the candle');SFX.light();$('fl').style.opacity=1;$('glow').style.opacity=1;setMood('warm');await sleep(2500);
 // SCENE 5 wish
 $('boyC').style.opacity=0;$('s4').firstElementChild.style.transition='transform 7s ease-in-out';$('s4').firstElementChild.style.transformOrigin='50% 55%';$('s4').firstElementChild.style.transform='scale(2.3)';await sleep(4500);
 await say('…he closes his eyes.',2200,{});
 await say('Not for her to come back.',2800);await say('Not for the past to change.',2800);await say('Just for her to always be happy.',4200,{});
 // blow
 $('mic').style.display='block';$('mic').classList.add('show');$('mic').onclick=micBlow;go.textContent='blow out the candle';go.classList.add('show');
 await new Promise(r=>{go.onclick=r;window.__blown=r});$('mic').classList.remove('show');$('mic').style.display='none';go.classList.remove('show');go.onclick=null;
 // SCENE 6 letting go
 SFX.whoosh();$('fl').style.opacity=0;$('glow').style.opacity=0;await sleep(1500);show('s6');setMood('dark');smoke();await sleep(3500);
 await say('Sometimes loving someone...',2400);await say('...means wishing them happiness,<br>even when you aren’t the reason for it.',4200);
 // SCENE 7
 $('stage').style.background='#b9ab98';show('s7');setMood('warm');dustOn=true;await sleep(1500);$('f1').style.left='62%';$('boyF').style.opacity=0;SFX.wind();
 await sleep(5000);await say('She found her happiness.',3000);await say('And maybe that’s all he ever wanted for her.',4500);
 // SCENE 8 letter
 dustOn=true;$('stage').style.background='#050505';show('s8');$('lp').classList.add('on');$('lp').style.animation='kb 40s linear forwards';$('lp').style.opacity=.22;await sleep(2000);
 const L=['Happy Birthday.','I don’t know if I still have a place in your life,<br>and maybe I don’t need one.','Life chose different paths for both of us.','You have your life,<br>your dreams,<br>your happiness...','and I sincerely hope you get everything beautiful<br>that life has to offer.','There was a time when I wished I could be beside you<br>for moments like this.','Today, I just wish you happiness<br>from wherever I am.','May you always smile.','May you always be surrounded by people who love you.','May every dream you have come true.','And wherever life takes you...<br>I hope it treats you kindly.','Happy Birthday.','Stay happy.','Always.'];
 const lt=$('ltr');lt.innerHTML='';for(const l of L){const p=document.createElement('p');p.innerHTML=l;lt.appendChild(p);await sleep(60);p.classList.add('s');lt.scrollTo({top:lt.scrollHeight,behavior:'smooth'});await sleep(2200+l.length*45)}
 await sleep(3500);
 // SCENE 9 unsent
 show('s9');$('lp').style.opacity=0;await sleep(2500);SFX.ding();
 const m='Happy Birthday ❤️\nI hope you\'re doing well.\nStay happy always.',b=$('bub');b.textContent='';
 for(const ch of m){b.textContent+=ch;SFX.type();await sleep(75)}
 await sleep(1500);const f=$('finger');f.style.opacity=1;await sleep(100);f.style.left='68%';f.style.bottom='20%';await sleep(2600);
 await sleep(2400);f.style.transition='all 1.6s';f.style.left='30%';f.style.bottom='45%';f.style.opacity=0;await sleep(1200);
 $('phone').style.transition='opacity 2.4s';$('phone').style.opacity=0;await sleep(2800);
 await say('Some feelings don’t need to be sent.',3000);await say('They only need to be felt.',3600);
 // FINAL
 setMood('hope');show('s10');$('stage').style.background='#0d1224';await sleep(1800);
 $('sun').style.transform='translateY(-10%)';const w=$('walker');w.style.opacity=1;await sleep(100);w.style.left='56%';
 await sleep(4000);await lines(['Some stories end.','Some memories remain.','And sometimes...','the purest goodbye is simply...'],2200);
 await say('Be happy.',3500,{});
 $('s10').classList.remove('on');$('end').classList.add('on');await sleep(1200);
 $('e1').style.opacity=1;await sleep(3500);$('e2').style.opacity=1;await sleep(4500);$('e3').style.opacity=1;await sleep(6000);
 mood='end';SFX.last();await sleep(7000);
 $('end').innerHTML='<button class="btn show" style="position:static;transform:none" id="rp">replay</button>';$('rp').onclick=()=>location.reload();
}
/* scratch */
function scratch(){return new Promise(async res=>{
 const c=$('scr'),x=c.getContext('2d');c.style.opacity=1;c.width=innerWidth;c.height=innerHeight;c.style.pointerEvents='auto';
 const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#2a2f3d');g.addColorStop(.5,'#4a4f5e');g.addColorStop(1,'#232733');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
 x.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<900;i++)x.fillRect(Math.random()*c.width,Math.random()*c.height,2,2);
 await sleep(500);$('ph1').classList.add('on');
 txt.className='mid';txt.textContent='Before you continue… scratch away the past.';txt.classList.add('show');
 let down=false,last,done=false,cnt=0;
 const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 const dr=e=>{if(!down||done)return;const p=pos(e);x.globalCompositeOperation='destination-out';x.lineWidth=60;x.lineCap='round';x.beginPath();x.moveTo(...(last||p));x.lineTo(...p);x.stroke();last=p;txt.classList.remove('show');if(++cnt%5==0)SFX.scratch();if(cnt%12==0)chk()};
 c.onpointerdown=e=>{down=true;last=pos(e);dr(e);audioInit()};c.onpointermove=dr;addEventListener('pointerup',()=>{down=false;last=null});
 async function chk(){const d=x.getImageData(0,0,c.width,c.height).data;let t=0,n=0;for(let i=3;i<d.length;i+=160){n++;if(d[i]<20)t++}
  if(t/n>.42&&!done){done=true;c.style.opacity=0;c.style.pointerEvents='none';await sleep(2200);
   txt.className='';txt.innerHTML='Happy Birthday ❤️';txt.style.fontSize='clamp(40px,10vw,64px)';txt.classList.add('show');
   const sp=$('spark');for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent='✦';s.style.cssText=`left:${10+Math.random()*80}%;top:${10+Math.random()*70}%;font-size:${10+Math.random()*14}px;animation-delay:${Math.random()*2.5}s`;sp.appendChild(s)}
   await sleep(6500);txt.classList.remove('show');await sleep(1500);txt.style.fontSize='';res()}}
})}
/* smoke */
function smoke(){const c=$('smk');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');let P=[],t0=Date.now();
 (function f(){const t=(Date.now()-t0)/1000;x.fillStyle='rgba(2,2,4,.18)';x.fillRect(0,0,c.width,c.height);
 if(t<9&&Math.random()<.9)P.push({x:c.width/2+(Math.random()-.5)*10,y:c.height*.62,vx:0,vy:-.6-Math.random()*.4,a:.5,r:3+Math.random()*3,age:0});
 P.forEach(p=>{p.age++;p.x+=Math.sin(p.age/18+p.y/40)*.5;p.y+=p.vy;const glow=p.age>110;p.a=glow?Math.max(0,.9-(p.age-110)/200):Math.min(.35,p.age/80);
  x.beginPath();if(glow){x.shadowBlur=14;x.shadowColor='#ffd68a';x.fillStyle='rgba(255,214,138,'+p.a+')';x.arc(p.x,p.y,1.8,0,7)}else{x.shadowBlur=0;x.fillStyle='rgba(180,180,190,'+p.a*.5+')';x.arc(p.x,p.y,p.r+p.age/25,0,7)}x.fill()});
 P=P.filter(p=>p.a>0||p.age<110);if(t<24)requestAnimationFrame(f)})()}
/* mic blow */
async function micBlow(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),a=AC.createMediaStreamSource(st),an=AC.createAnalyser();an.fftSize=512;a.connect(an);const d=new Uint8Array(an.fftSize);$('mic').textContent='listening… blow gently';
 (function c(){an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));if(m>70){st.getTracks().forEach(t=>t.stop());window.__blown()}else requestAnimationFrame(c)})()}catch(e){$('mic').textContent='mic unavailable — just tap'}}
$('start').onclick=film;
</script></body></html>
